worker_processes auto;
events { worker_connections 4096; }

http {
    # ----- Rate limiting (token bucket) -----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_status 429;

    # ----- Upstreams (use host.docker.internal so nginx-in-docker reaches host apps) -----
    upstream order_backend      { server host.docker.internal:8081; keepalive 32; }
    upstream inventory_backend  { server host.docker.internal:8082; keepalive 32; }
    upstream analytics_backend  { server host.docker.internal:8083; keepalive 32; }

    log_format upstream_time '$remote_addr - $request '
                             'status=$status upstream=$upstream_addr '
                             'req_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log upstream_time;
    error_log  /var/log/nginx/error.log warn;

    # gzip
    gzip on;
    gzip_types application/json text/plain;

    server {
        listen 80;

        # health check
        location = /health {
            return 200 '{"gateway":"UP"}';
            default_type application/json;
        }

        # circuit-breaker-friendly timeouts
        proxy_connect_timeout 2s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;
        proxy_next_upstream   error timeout http_502 http_503 http_504;
        proxy_http_version    1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        location /api/v1/orders {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://order_backend;
        }

        location /api/v1/inventory {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://inventory_backend;
        }

        location /api/v1/analytics {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://analytics_backend;
        }
    }
}
